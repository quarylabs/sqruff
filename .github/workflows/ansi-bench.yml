name: Benchmark
on:
  pull_request:
  merge_group:
env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Advancing .sqlfluff-sha on its own cannot change benchmark results.
  sqlfluff-sha-only:
    name: SQLFluff SHA Only
    uses: ./.github/workflows/sqlfluff-sha-only.yml
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    needs: sqlfluff-sha-only
    if: needs.sqlfluff-sha-only.outputs.sqlfluff-sha-only != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # ratchet:bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Install LLD
        run: sudo apt-get update --yes && sudo apt-get install --yes lld
      - name: Run benchmarks
        run: bazelisk run //:bench_ansi
