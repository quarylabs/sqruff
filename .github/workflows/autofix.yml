name: Auto-fix
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A .sqlfluff-sha bump has nothing to format or regenerate.
  sqlfluff-sha-only:
    name: SQLFluff SHA Only
    uses: ./.github/workflows/sqlfluff-sha-only.yml

  autofix:
    name: Auto-fix formatting
    runs-on: ubuntu-latest
    needs: sqlfluff-sha-only
    # Don't run on forks (they can't push back) or dependabot PRs
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
      && needs.sqlfluff-sha-only.outputs.sqlfluff-sha-only != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # ratchet:bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Run rustfmt
        run: bazelisk run --lockfile_mode=error @rules_rust//:rustfmt

      - name: Run Prettier
        run: bazelisk run --lockfile_mode=error //:prettier_fix

      - name: Run ruff
        run: bazelisk run --lockfile_mode=error //:ruff_fix

      - name: Regenerate docs
        run: bazelisk run --lockfile_mode=error //:codegen_docs_fix

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push fixes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-fix formatting"
          git push
