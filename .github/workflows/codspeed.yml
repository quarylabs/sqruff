name: CodSpeed

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # Advancing .sqlfluff-sha on its own cannot change benchmark results.
  sqlfluff-sha-only:
    name: SQLFluff SHA Only
    uses: ./.github/workflows/sqlfluff-sha-only.yml

  benchmarks:
    name: Run benchmarks
    runs-on: codspeed-macro
    needs: sqlfluff-sha-only
    if: needs.sqlfluff-sha-only.outputs.sqlfluff-sha-only != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # ratchet:moonrepo/setup-rust@v1
        with:
          channel: 1.99.0
          cache-target: release
          bins: cargo-codspeed

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Build the benchmark target(s)
        run: cargo codspeed build --package sqruff-lib

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # ratchet:CodSpeedHQ/action@v5.5.0
        with:
          run: cargo codspeed run --package sqruff-lib
          mode: walltime
