[package]
name = "sqruff-lib-dialects"
description = "Implementation of sql dialects for sqruff."
version.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[test]]
name = "dialects"
harness = true

[features]
default = [
    "athena",
    "bigquery",
    "clickhouse",
    "databricks",
    "db2",
    "duckdb",
    "exasol",
    "greenplum",
    "hive",
    "mariadb",
    "mysql",
    "materialize",
    "oracle",
    "postgres",
    "redshift",
    "snowflake",
    "sparksql",
    "sqlite",
    "starrocks",
    "teradata",
    "trino",
    "tsql",
    "vertica",
]
athena = []
bigquery = []
clickhouse = []
databricks = ["sparksql"]
db2 = []
duckdb = ["postgres"]
exasol = []
greenplum = ["postgres"]
hive = []
mariadb = ["mysql"]
mysql = []
materialize = ["postgres"]
oracle = []
postgres = []
redshift = ["postgres"]
snowflake = []
sparksql = ["hive"]
sqlite = []
starrocks = ["mysql"]
teradata = []
trino = []
tsql = []
vertica = []

[dependencies]
sqruff-lib-core.workspace = true
strum.workspace = true
itertools = "0.15.0"
hashbrown.workspace = true
serde_yaml = "0.9.34+deprecated"

[dev-dependencies]
configparser = "3.2.0"
sqruff-lib-core.workspace = true
sqruff-lib-core.features = ["serde", "stringify"]
rayon = "1.12.0"
expect-test = "1.5.0"
glob = "0.3.1"
serde_yaml = "0.9.34+deprecated"
