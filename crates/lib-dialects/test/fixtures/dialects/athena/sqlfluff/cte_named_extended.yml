file:
- statement:
  - with_compound_statement:
    - keyword: with
    - common_table_expression:
      - naked_identifier: extended
      - keyword: as
      - bracketed:
        - start_bracket: (
        - select_statement:
          - select_clause:
            - keyword: select
            - select_clause_element:
              - numeric_literal: '1'
              - alias_expression:
                - alias_operator:
                  - keyword: as
                - naked_identifier: a
        - end_bracket: )
    - select_statement:
      - select_clause:
        - keyword: select
        - select_clause_element:
          - wildcard_expression:
            - wildcard_identifier:
              - star: '*'
      - from_clause:
        - keyword: from
        - from_expression:
          - from_expression_element:
            - table_expression:
              - table_reference:
                - naked_identifier: extended
