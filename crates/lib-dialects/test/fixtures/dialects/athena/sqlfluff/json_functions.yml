file:
- statement:
  - select_statement:
    - select_clause:
      - keyword: select
      - select_clause_element:
        - function:
          - function_name:
            - function_name_identifier: json_object
          - function_contents:
            - bracketed:
              - start_bracket: (
              - expression:
                - quoted_literal: '''key1'''
              - colon_delimiter: ':'
              - expression:
                - numeric_literal: '1'
              - comma: ','
              - expression:
                - quoted_literal: '''key2'''
              - colon_delimiter: ':'
              - expression:
                - boolean_literal: 'true'
              - end_bracket: )
- statement_terminator: ;
