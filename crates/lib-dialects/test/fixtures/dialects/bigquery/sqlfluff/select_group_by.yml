file:
- statement:
  - select_statement:
    - select_clause:
      - keyword: select
      - select_clause_element:
        - column_reference:
          - naked_identifier: foo
      - comma: ','
      - select_clause_element:
        - function:
          - function_name:
            - function_name_identifier: count
          - function_contents:
            - bracketed:
              - start_bracket: (
              - star: '*'
              - end_bracket: )
    - from_clause:
      - keyword: from
      - from_expression:
        - from_expression_element:
          - table_expression:
            - table_reference:
              - naked_identifier: bar
    - groupby_clause:
      - keyword: group
      - keyword: by
      - keyword: all
- statement_terminator: ;
