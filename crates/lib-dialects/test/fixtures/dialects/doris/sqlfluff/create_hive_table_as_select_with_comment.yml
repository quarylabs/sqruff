file:
- statement:
  - create_table_statement:
    - keyword: CREATE
    - keyword: TABLE
    - table_reference:
      - naked_identifier: hive_catalog
      - dot: .
      - naked_identifier: hive_db
      - dot: .
      - naked_identifier: hive_table_with_comment
    - keyword: ENGINE
    - comparison_operator:
      - raw_comparison_operator: =
    - engine_type: hive
    - comment_clause:
      - keyword: COMMENT
      - quoted_literal: '''This is a Hive table created as select.'''
    - keyword: PROPERTIES
    - bracketed:
      - start_bracket: (
      - quoted_literal: '''file_format'''
      - comparison_operator:
        - raw_comparison_operator: =
      - quoted_literal: '''parquet'''
      - end_bracket: )
    - keyword: AS
    - select_statement:
      - select_clause:
        - keyword: SELECT
        - select_clause_element:
          - column_reference:
            - naked_identifier: id
        - comma: ','
        - select_clause_element:
          - column_reference:
            - naked_identifier: name
      - from_clause:
        - keyword: FROM
        - from_expression:
          - from_expression_element:
            - table_expression:
              - table_reference:
                - naked_identifier: source_table
- statement_terminator: ;
