file:
- statement:
  - create_table_statement:
    - keyword: CREATE
    - keyword: TABLE
    - table_reference:
      - naked_identifier: hive_catalog
      - dot: .
      - naked_identifier: hive_db
      - dot: .
      - naked_identifier: hive_table
    - keyword: ENGINE
    - comparison_operator:
      - raw_comparison_operator: =
    - engine_type: hive
    - keyword: PROPERTIES
    - bracketed:
      - start_bracket: (
      - quoted_literal: '''file_format'''
      - comparison_operator:
        - raw_comparison_operator: =
      - quoted_literal: '''parquet'''
      - comma: ','
      - quoted_literal: '''hive.metastore.uris'''
      - comparison_operator:
        - raw_comparison_operator: =
      - quoted_literal: '''thrift://127.0.0.1:9083'''
      - end_bracket: )
    - keyword: AS
    - select_statement:
      - select_clause:
        - keyword: SELECT
        - select_clause_element:
          - wildcard_expression:
            - wildcard_identifier:
              - star: '*'
      - from_clause:
        - keyword: FROM
        - from_expression:
          - from_expression_element:
            - table_expression:
              - table_reference:
                - naked_identifier: source_table
- statement_terminator: ;
