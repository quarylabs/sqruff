file:
- statement:
  - create_table_statement:
    - keyword: CREATE
    - keyword: TABLE
    - table_reference:
      - naked_identifier: hive_catalog
      - dot: .
      - naked_identifier: hive_db
      - dot: .
      - naked_identifier: commented_table
    - bracketed:
      - start_bracket: (
      - column_definition:
        - naked_identifier: id
        - data_type:
          - data_type_identifier: INT
        - column_constraint_segment:
          - comment_clause:
            - keyword: COMMENT
            - quoted_literal: '''Primary key'''
      - comma: ','
      - column_definition:
        - naked_identifier: name
        - data_type:
          - data_type_identifier: STRING
        - column_constraint_segment:
          - comment_clause:
            - keyword: COMMENT
            - quoted_literal: '''User name'''
      - comma: ','
      - column_definition:
        - naked_identifier: age
        - data_type:
          - data_type_identifier: INT
        - column_constraint_segment:
          - comment_clause:
            - keyword: COMMENT
            - quoted_literal: '''User age'''
      - comma: ','
      - column_definition:
        - naked_identifier: email
        - data_type:
          - data_type_identifier: STRING
        - column_constraint_segment:
          - comment_clause:
            - keyword: COMMENT
            - quoted_literal: '''User email address'''
      - end_bracket: )
    - keyword: ENGINE
    - comparison_operator:
      - raw_comparison_operator: =
    - engine_type: hive
    - comment_clause:
      - keyword: COMMENT
      - quoted_literal: '''This is a test table for Hive catalog'''
    - keyword: PROPERTIES
    - bracketed:
      - start_bracket: (
      - quoted_literal: '''file_format'''
      - comparison_operator:
        - raw_comparison_operator: =
      - quoted_literal: '''parquet'''
      - comma: ','
      - quoted_literal: '''hive.metastore.uris'''
      - comparison_operator:
        - raw_comparison_operator: =
      - quoted_literal: '''thrift://127.0.0.1:9083'''
      - end_bracket: )
- statement_terminator: ;
