file:
- statement:
  - create_table_statement:
    - keyword: CREATE
    - keyword: TABLE
    - keyword: IF
    - keyword: NOT
    - keyword: EXISTS
    - table_reference:
      - naked_identifier: t10
    - keyword: PROPERTIES
    - bracketed:
      - start_bracket: (
      - quoted_literal: '''replication_num'''
      - comparison_operator:
        - raw_comparison_operator: =
      - quoted_literal: '''1'''
      - end_bracket: )
    - keyword: AS
    - select_statement:
      - select_clause:
        - keyword: SELECT
        - select_clause_element:
          - wildcard_expression:
            - wildcard_identifier:
              - star: '*'
      - from_clause:
        - keyword: FROM
        - from_expression:
          - from_expression_element:
            - table_expression:
              - table_reference:
                - naked_identifier: t1
- statement_terminator: ;
