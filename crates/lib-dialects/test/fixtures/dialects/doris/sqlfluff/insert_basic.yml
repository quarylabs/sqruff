file:
- statement:
  - insert_statement:
    - keyword: INSERT
    - keyword: INTO
    - table_reference:
      - naked_identifier: test
    - values_clause:
      - keyword: VALUES
      - bracketed:
        - start_bracket: (
        - numeric_literal: '1'
        - comma: ','
        - numeric_literal: '2'
        - end_bracket: )
- statement_terminator: ;
