      - start_bracket: (
      - naked_identifier: p1
      - comma: ','
      - naked_identifier: p2
      - end_bracket: )
    - keyword: WITH
    - keyword: LABEL
    - naked_identifier: label1
    - bracketed:
      - start_bracket: (
