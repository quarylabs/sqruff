file:
- statement:
  - insert_statement:
    - keyword: INSERT
    - keyword: INTO
    - table_reference:
      - naked_identifier: hive_catalog
      - dot: .
      - naked_identifier: hive_db
      - dot: .
      - naked_identifier: hive_table
    - select_statement:
      - select_clause:
        - keyword: SELECT
        - select_clause_element:
          - wildcard_expression:
            - wildcard_identifier:
              - star: '*'
      - from_clause:
        - keyword: FROM
        - from_expression:
          - from_expression_element:
            - table_expression:
              - table_reference:
                - naked_identifier: source_table
- statement_terminator: ;
