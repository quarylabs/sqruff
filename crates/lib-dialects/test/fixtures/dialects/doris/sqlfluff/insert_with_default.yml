file:
- statement:
  - insert_statement:
    - keyword: INSERT
    - keyword: INTO
    - table_reference:
      - naked_identifier: test
    - bracketed:
      - start_bracket: (
      - column_reference:
        - naked_identifier: c1
      - comma: ','
      - column_reference:
        - naked_identifier: c2
      - end_bracket: )
    - values_clause:
      - keyword: VALUES
      - bracketed:
        - start_bracket: (
        - numeric_literal: '1'
        - comma: ','
        - keyword: DEFAULT
        - end_bracket: )
- statement_terminator: ;
