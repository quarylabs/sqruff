file:
- statement:
  - insert_statement:
    - keyword: INSERT
    - keyword: INTO
    - table_reference:
      - naked_identifier: test
    - keyword: PARTITION
    - bracketed:
      - start_bracket: (
      - naked_identifier: p1
      - comma: ','
      - naked_identifier: p2
      - end_bracket: )
    - select_statement:
      - select_clause:
        - keyword: SELECT
        - select_clause_element:
          - wildcard_expression:
            - wildcard_identifier:
              - star: '*'
      - from_clause:
        - keyword: FROM
        - from_expression:
          - from_expression_element:
            - table_expression:
              - table_reference:
                - naked_identifier: test2
- statement_terminator: ;
