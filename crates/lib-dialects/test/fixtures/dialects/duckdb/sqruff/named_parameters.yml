file:
- statement:
  - select_statement:
    - select_clause:
      - keyword: SELECT
      - select_clause_element:
        - dollar_literal: $name
      - comma: ','
      - select_clause_element:
        - dollar_literal: $_value
      - comma: ','
      - select_clause_element:
        - dollar_literal: $value1
      - comma: ','
      - select_clause_element:
        - dollar_literal: $MixedCase
      - comma: ','
      - select_clause_element:
        - dollar_literal: $名前
- statement_terminator: ;
- statement:
  - select_statement:
    - select_clause:
      - keyword: SELECT
      - select_clause_element:
        - expression:
          - cast_expression:
            - dollar_literal: $name
            - casting_operator: '::'
            - data_type:
              - keyword: VARCHAR
      - comma: ','
      - select_clause_element:
        - function:
          - function_name:
            - function_name_identifier: CAST
          - function_contents:
            - bracketed:
              - start_bracket: (
              - expression:
                - dollar_literal: $count
              - keyword: AS
              - data_type:
                - keyword: INTEGER
              - end_bracket: )
      - comma: ','
      - select_clause_element:
        - function:
          - function_name:
            - function_name_identifier: COALESCE
          - function_contents:
            - bracketed:
              - start_bracket: (
              - expression:
                - dollar_literal: $name
              - comma: ','
              - expression:
                - quoted_literal: '''unknown'''
              - end_bracket: )
- statement_terminator: ;
- statement:
  - select_statement:
    - select_clause:
      - keyword: SELECT
      - select_clause_element:
        - wildcard_expression:
          - wildcard_identifier:
            - star: '*'
    - from_clause:
      - keyword: FROM
      - from_expression:
        - from_expression_element:
          - table_expression:
            - table_reference:
              - naked_identifier: items
    - where_clause:
      - keyword: WHERE
      - expression:
        - bracketed:
          - start_bracket: (
          - expression:
            - dollar_literal: $start
            - keyword: IS
            - null_literal: 'NULL'
            - binary_operator: OR
            - column_reference:
              - naked_identifier: id
            - comparison_operator:
              - raw_comparison_operator: '>'
              - raw_comparison_operator: =
            - dollar_literal: $start
          - end_bracket: )
        - binary_operator: AND
        - column_reference:
          - naked_identifier: id
        - comparison_operator:
          - raw_comparison_operator: <
          - raw_comparison_operator: =
        - dollar_literal: $end
- statement_terminator: ;
- statement:
  - select_statement:
    - select_clause:
      - keyword: SELECT
      - select_clause_element:
        - expression:
          - case_expression:
            - keyword: CASE
            - when_clause:
              - keyword: WHEN
              - expression:
                - dollar_literal: $target
                - comparison_operator: ==
                - quoted_literal: '''stream_id'''
              - keyword: THEN
              - expression:
                - column_reference:
                  - naked_identifier: stream_id
            - else_clause:
              - keyword: ELSE
              - expression:
                - column_reference:
                  - naked_identifier: name
            - keyword: END
    - from_clause:
      - keyword: FROM
      - from_expression:
        - from_expression_element:
          - table_expression:
            - table_reference:
              - naked_identifier: items
- statement_terminator: ;
- statement:
  - select_statement:
    - select_clause:
      - keyword: SELECT
      - select_clause_element:
        - dollar_numeric_literal: $1
      - comma: ','
      - select_clause_element:
        - dollar_numeric_literal: $2
- statement_terminator: ;
- statement:
  - select_statement:
    - select_clause:
      - keyword: SELECT
      - select_clause_element:
        - quoted_literal: '''$name'''
      - comma: ','
      - select_clause_element:
        - column_reference:
          - quoted_identifier: '"$name"'
      - comma: ','
      - select_clause_element:
        - quoted_literal: $$a $name string$$
        - comma: ','
        - quoted_literal: $tag$a $name string$tag$
- statement_terminator: ;
