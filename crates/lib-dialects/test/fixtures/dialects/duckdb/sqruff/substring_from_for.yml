file:
- statement:
  - select_statement:
    - select_clause:
      - keyword: SELECT
      - select_clause_element:
        - function:
          - function_name:
            - function_name_identifier: substring
          - function_contents:
            - bracketed:
              - start_bracket: (
              - expression:
                - column_reference:
                  - naked_identifier: name
              - keyword: FROM
              - expression:
                - numeric_literal: '2'
              - keyword: FOR
              - expression:
                - function:
                  - function_name:
                    - function_name_identifier: length
                  - function_contents:
                    - bracketed:
                      - start_bracket: (
                      - expression:
                        - column_reference:
                          - naked_identifier: name
                      - end_bracket: )
                - binary_operator: '-'
                - numeric_literal: '1'
              - end_bracket: )
    - from_clause:
      - keyword: FROM
      - from_expression:
        - from_expression_element:
          - table_expression:
            - table_reference:
              - naked_identifier: tbl
- statement_terminator: ;
