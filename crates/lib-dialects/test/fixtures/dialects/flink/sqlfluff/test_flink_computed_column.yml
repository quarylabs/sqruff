file:
- statement:
  - create_table_statement:
    - keyword: CREATE
    - keyword: TABLE
    - table_reference:
      - naked_identifier: my_table
    - bracketed:
      - start_bracket: (
      - column_definition:
        - naked_identifier: id
        - data_type:
          - data_type_identifier: INT
      - comma: ','
      - column_definition:
        - naked_identifier: name
        - data_type:
          - data_type_identifier: STRING
      - comma: ','
      - naked_identifier: full_name
      - keyword: AS
      - expression:
        - function:
          - function_name:
            - function_name_identifier: CONCAT
          - function_contents:
            - bracketed:
              - start_bracket: (
              - expression:
                - column_reference:
                  - naked_identifier: name
              - comma: ','
              - expression:
                - quoted_literal: '''_suffix'''
              - end_bracket: )
      - end_bracket: )
    - keyword: WITH
    - bracketed:
      - start_bracket: (
      - quoted_literal: '''connector'''
      - comparison_operator:
        - raw_comparison_operator: =
      - quoted_literal: '''kafka'''
      - end_bracket: )
- statement_terminator: ;
