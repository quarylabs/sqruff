file:
- statement:
  - create_table_statement:
    - keyword: CREATE
    - keyword: TABLE
    - table_reference:
      - naked_identifier: my_table
    - bracketed:
      - start_bracket: (
      - column_definition:
        - naked_identifier: id
        - data_type:
          - data_type_identifier: INT
      - comma: ','
      - column_definition:
        - naked_identifier: nested_data
        - data_type:
          - row_data_type:
            - keyword: ROW
            - start_angle_bracket: <
            - naked_identifier: name
            - data_type:
              - data_type_identifier: STRING
            - comma: ','
            - naked_identifier: age
            - data_type:
              - data_type_identifier: INT
            - end_angle_bracket: '>'
      - end_bracket: )
    - keyword: WITH
    - bracketed:
      - start_bracket: (
      - quoted_literal: '''connector'''
      - comparison_operator:
        - raw_comparison_operator: =
      - quoted_literal: '''kafka'''
      - end_bracket: )
- statement_terminator: ;
