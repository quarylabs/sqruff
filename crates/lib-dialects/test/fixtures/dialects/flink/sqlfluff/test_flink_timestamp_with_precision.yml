file:
- statement:
  - create_table_statement:
    - keyword: CREATE
    - keyword: TABLE
    - table_reference:
      - naked_identifier: my_table
    - bracketed:
      - start_bracket: (
      - column_definition:
        - naked_identifier: id
        - data_type:
          - data_type_identifier: INT
      - comma: ','
      - column_definition:
        - naked_identifier: event_time
        - data_type:
          - keyword: TIMESTAMP
          - bracketed_arguments:
            - bracketed:
              - start_bracket: (
              - numeric_literal: '3'
              - end_bracket: )
      - comma: ','
      - column_definition:
        - naked_identifier: processing_time
        - data_type:
          - data_type_identifier: TIMESTAMP_LTZ
          - bracketed_arguments:
            - bracketed:
              - start_bracket: (
              - numeric_literal: '3'
              - end_bracket: )
      - end_bracket: )
    - keyword: WITH
    - bracketed:
      - start_bracket: (
      - quoted_literal: '''connector'''
      - comparison_operator:
        - raw_comparison_operator: =
      - quoted_literal: '''kafka'''
      - end_bracket: )
- statement_terminator: ;
