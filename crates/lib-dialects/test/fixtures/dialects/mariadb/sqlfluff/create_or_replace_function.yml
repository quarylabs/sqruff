file:
- statement:
  - create_function_statement:
    - keyword: CREATE
    - keyword: OR
    - keyword: REPLACE
    - keyword: FUNCTION
    - function_name:
      - quoted_identifier: '`testfunction`'
    - function_parameter_list:
      - bracketed:
        - start_bracket: (
        - end_bracket: )
    - keyword: RETURNS
    - data_type:
      - data_type_identifier: VARCHAR
      - bracketed_arguments:
        - bracketed:
          - start_bracket: (
          - numeric_literal: '20'
          - end_bracket: )
    - characteristic_statement:
      - keyword: DETERMINISTIC
    - function_definition:
      - transaction_statement:
        - keyword: BEGIN
        - statement:
          - return_statement:
            - keyword: RETURN
            - expression:
              - quoted_literal: '"foo"'
- statement_terminator: ;
- statement:
  - transaction_statement:
    - keyword: END
- statement_terminator: '~'
