file:
- statement:
  - create_table_statement:
    - keyword: CREATE
    - keyword: TEMPORARY
    - keyword: TABLE
    - table_reference:
      - naked_identifier: tbl_name
    - bracketed:
      - start_bracket: (
      - column_definition:
        - naked_identifier: id
        - data_type:
          - data_type_identifier: INT
        - column_constraint_segment:
          - keyword: PRIMARY
          - keyword: KEY
        - column_constraint_segment:
          - keyword: AUTO_INCREMENT
      - comma: ','
      - column_definition:
        - naked_identifier: col
        - data_type:
          - data_type_identifier: VARCHAR
          - bracketed_arguments:
            - bracketed:
              - start_bracket: (
              - numeric_literal: '255'
              - end_bracket: )
        - column_constraint_segment:
          - keyword: DEFAULT
          - quoted_literal: ''''''
        - column_constraint_segment:
          - keyword: NOT
          - keyword: 'NULL'
      - comma: ','
      - table_constraint:
        - keyword: INDEX
        - bracketed:
          - start_bracket: (
          - column_reference:
            - naked_identifier: col
          - end_bracket: )
      - end_bracket: )
    - keyword: AS
    - select_statement:
      - select_clause:
        - keyword: SELECT
        - select_clause_element:
          - column_reference:
            - naked_identifier: id
        - comma: ','
        - select_clause_element:
          - column_reference:
            - naked_identifier: col
      - from_clause:
        - keyword: FROM
        - from_expression:
          - from_expression_element:
            - table_expression:
              - table_reference:
                - naked_identifier: table_name
- statement_terminator: ;
