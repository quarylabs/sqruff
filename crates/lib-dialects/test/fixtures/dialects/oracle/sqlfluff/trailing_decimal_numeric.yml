file:
- oracle_batch:
  - statement:
    - select_statement:
      - select_clause:
        - keyword: SELECT
        - select_clause_element:
          - numeric_literal: '1.'
        - comma: ','
        - select_clause_element:
          - numeric_literal: '1.0'
        - comma: ','
        - select_clause_element:
          - numeric_literal: '22.50'
      - from_clause:
        - keyword: FROM
        - from_expression:
          - from_expression_element:
            - table_expression:
              - oracle_table_reference:
                - naked_identifier: ex_tab
      - where_clause:
        - keyword: WHERE
        - expression:
          - column_reference:
            - naked_identifier: ex_col
          - comparison_operator:
            - raw_comparison_operator: =
          - numeric_literal: '1.'
  - statement_terminator: ;
