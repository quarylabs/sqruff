file:
- statement:
  - select_statement:
    - select_clause:
      - keyword: SELECT
      - select_clause_element:
        - function:
          - function_name:
            - function_name_identifier: count
          - function_contents:
            - bracketed:
              - start_bracket: (
              - star: '*'
              - end_bracket: )
    - from_clause:
      - keyword: FROM
      - from_expression:
        - from_expression_element:
          - table_expression:
            - table_reference:
              - naked_identifier: foo
    - where_clause:
      - keyword: WHERE
      - expression:
        - column_reference:
          - naked_identifier: status
        - comparison_operator:
          - raw_comparison_operator: =
        - psql_variable:
          - psql_variable_colon: ':'
          - parameter: status
- statement_terminator: ;
