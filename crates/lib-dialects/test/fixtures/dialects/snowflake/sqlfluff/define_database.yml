file:
- statement:
  - define_statement:
    - keyword: DEFINE
    - keyword: DATABASE
    - object_reference:
      - naked_identifier: DCM_PROJECT
    - comment_equals_clause:
      - keyword: COMMENT
      - comparison_operator:
        - raw_comparison_operator: =
      - quoted_literal: '''For DCM Quickstart Demo'''
- statement_terminator: ;
