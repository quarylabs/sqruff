file:
- statement:
  - create_table_statement:
    - keyword: CREATE
    - keyword: TABLE
    - table_reference:
      - naked_identifier: users
    - bracketed:
      - start_bracket: (
      - column_definition:
        - naked_identifier: user_id
        - data_type:
          - data_type_identifier: INTEGER
        - column_constraint_segment:
          - keyword: PRIMARY
          - keyword: KEY
          - conflict_clause:
            - keyword: ON
            - keyword: CONFLICT
            - keyword: ROLLBACK
      - comma: ','
      - column_definition:
        - naked_identifier: user_name
        - data_type:
          - data_type_identifier: TEXT
        - column_constraint_segment:
          - keyword: NOT
          - keyword: 'NULL'
          - conflict_clause:
            - keyword: ON
            - keyword: CONFLICT
            - keyword: ABORT
      - end_bracket: )
- statement_terminator: ;
- statement:
  - alter_table_statement:
    - keyword: ALTER
    - keyword: TABLE
    - table_reference:
      - naked_identifier: users
    - keyword: ADD
    - keyword: COLUMN
    - column_definition:
      - naked_identifier: name
      - data_type:
        - data_type_identifier: TEXT
      - column_constraint_segment:
        - keyword: UNIQUE
        - conflict_clause:
          - keyword: ON
          - keyword: CONFLICT
          - keyword: FAIL
- statement_terminator: ;
