file:
- statement:
  - select_statement:
    - select_clause:
      - keyword: SELECT
      - select_clause_element:
        - column_reference:
          - naked_identifier: id
    - from_clause:
      - keyword: FROM
      - from_expression:
        - from_expression_element:
          - table_expression:
            - table_reference:
              - naked_identifier: mytable
    - qualify_clause:
      - keyword: qualify
      - expression:
        - expression:
          - function:
            - function_name:
              - function_name_identifier: count
            - function_contents:
              - bracketed:
                - start_bracket: (
                - star: '*'
                - end_bracket: )
            - over_clause:
              - keyword: over
              - bracketed:
                - start_bracket: (
                - window_specification:
                  - partitionby_clause:
                    - keyword: partition
                    - keyword: by
                    - expression:
                      - expression:
                        - column_reference:
                          - naked_identifier: id
                - end_bracket: )
          - comparison_operator:
            - raw_comparison_operator: '>'
          - numeric_literal: '1'
- statement_terminator: ;
