file:
- batch:
  - statement:
    - create_function_statement:
      - keyword: create
      - keyword: function
      - object_reference:
        - naked_identifier: my_function
      - function_parameter_list:
        - bracketed:
          - start_bracket: (
          - tsql_variable: '@my_parameter'
          - data_type:
            - keyword: int
          - end_bracket: )
      - keyword: returns
      - data_type:
        - keyword: int
      - function_option_segment:
        - keyword: with
        - keyword: schemabinding
        - comma: ','
        - keyword: returns
        - keyword: 'null'
        - keyword: on
        - keyword: 'null'
        - keyword: input
      - procedure_statement:
        - statement:
          - keyword: begin
          - statement:
            - return_segment:
              - keyword: return
              - expression:
                - parameterized_expression:
                  - tsql_variable: '@my_parameter'
          - keyword: end
  - go_statement:
    - keyword: go
