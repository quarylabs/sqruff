file:
- statement:
  - create_table_statement:
    - create_table_statement:
      - keyword: CREATE
      - keyword: TABLE
      - table_reference:
        - object_reference:
          - naked_identifier: table_name
      - bracketed:
        - start_bracket: (
        - column_definition:
          - naked_identifier: id
          - data_type:
            - data_type_identifier: UNIQUEIDENTIFIER
          - column_constraint_segment:
            - keyword: NOT
            - keyword: 'NULL'
          - column_constraint_segment:
            - keyword: CONSTRAINT
            - object_reference:
              - naked_identifier: constraint_name
            - keyword: REFERENCES
            - table_reference:
              - object_reference:
                - naked_identifier: referenced_table_name
            - keyword: ON
            - keyword: DELETE
            - keyword: NO
            - keyword: ACTION
        - end_bracket: )
- statement_terminator: ;
