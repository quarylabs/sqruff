file:
- statement:
  - select_statement:
    - select_clause:
      - keyword: SELECT
      - select_clause_element:
        - column_reference:
          - naked_identifier: ID
    - from_clause:
      - keyword: FROM
      - from_expression:
        - from_expression_element:
          - table_expression:
            - table_reference:
              - object_reference:
                - naked_identifier: dbo
                - dot: .
                - naked_identifier: tableX
            - bracketed:
              - start_bracket: (
              - keyword: NOLOCK
              - end_bracket: )
- statement_terminator: ;
- statement:
  - keyword: GO
