file:
- batch:
  - statement:
    - execute_script_statement:
      - keyword: EXECUTE
      - object_reference:
        - naked_identifier: sp_add_job
      - tsql_variable: '@job_name'
      - comparison_operator:
        - raw_comparison_operator: =
      - expression:
        - quoted_literal: '''TestJob'''
      - statement_terminator: ;
  - statement:
    - keyword: BEGIN
    - waitfor_statement:
      - keyword: WAITFOR
      - keyword: TIME
      - expression:
        - quoted_literal: '''22:20'''
    - statement_terminator: ;
    - execute_script_statement:
      - keyword: EXECUTE
      - object_reference:
        - naked_identifier: sp_update_job
      - tsql_variable: '@job_name'
      - comparison_operator:
        - raw_comparison_operator: =
      - expression:
        - quoted_literal: '''TestJob'''
      - comma: ','
      - tsql_variable: '@new_name'
      - comparison_operator:
        - raw_comparison_operator: =
      - expression:
        - quoted_literal: '''UpdatedJob'''
      - statement_terminator: ;
    - keyword: END
  - statement_terminator: ;
  - go_statement:
    - keyword: GO
- batch:
  - statement:
    - keyword: BEGIN
    - waitfor_statement:
      - keyword: WAITFOR
      - keyword: DELAY
      - expression:
        - quoted_literal: '''02:00'''
    - statement_terminator: ;
    - execute_script_statement:
      - keyword: EXECUTE
